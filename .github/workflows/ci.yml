name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    name: test · typecheck · build-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version questline is developed against.
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build binary + smoke
        run: |
          bun run build
          ./dist/questline --version
